<svg width="135" height="30" viewBox="0 0 135 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoIconGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Indovia Emblem Icon -->
  <g transform="translate(0, 2)">
    <!-- Rounded Container -->
    <rect width="26" height="26" rx="7" fill="url(#logoIconGradLight)" />
    
    <!-- Bag Handle -->
    <path d="M 9 9 C 9 6, 17 6, 17 9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <!-- Lightning Bolt / Growth Monogram -->
    <path d="M 14.5 9 L 10.5 15.5 L 13.5 15.5 L 11.5 21 L 16.5 14.5 L 13.5 14.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Indovia Wordmark (White) -->
  <text x="34" y="22" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="1.5" 
        fill="#FFFFFF">
    INDOVIA
  </text>
</svg>
