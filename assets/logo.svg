<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%">
  <defs>
    <linearGradient id="indoviaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="indoviaGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(40, 20)">
    <!-- Ambient Glow behind icon -->
    <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#indoviaGrad1)" opacity="0.2" filter="url(#glow)"/>
    
    <!-- Outer Rounded Glass Badge -->
    <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#indoviaGrad1)" />
    
    <!-- Geometric Overlay Shape (Folded Bag & Lightning "I") -->
    <!-- Shopping bag handle -->
    <path d="M 45 42 C 45 32, 75 32, 75 42" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
    
    <!-- Front Store Facet -->
    <path d="M 36 48 L 84 48 L 78 94 C 77 98, 74 100, 70 100 L 50 100 C 46 100, 43 98, 42 94 Z" fill="#FFFFFF" opacity="0.22"/>
    
    <!-- Lightning / Growth Bolt in Center -->
    <path d="M 64 45 L 48 70 L 60 70 L 54 95 L 72 68 L 60 68 Z" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(175, 45)">
    <!-- Main Brand Name -->
    <text x="0" y="52" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="54" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="url(#textGrad)">
      INDOVIA
    </text>

    <!-- Tagline / Descriptor -->
    <text x="3" y="80" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="6" 
          fill="#94A3B8">
      MODULAR STORE ENGINE
    </text>
  </g>
</svg>
